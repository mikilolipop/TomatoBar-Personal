name: tests

# Replaces the upstream release workflow, which was unusable here: it needs
# CODESIGN_CERT_* secrets this repo does not have, its Build step hardcodes
# TomatoBar.app while PRODUCT_NAME is "TomatoBar Personal", and its first step
# deletes a prerelease tag. See docs/BACKLOG.md P7.
#
# `main` is excluded because it is the frozen upstream baseline (90a77d6) and
# contains neither scripts/test.sh nor Tests/. Note that a push to `main` would
# run the workflow file from that ref, i.e. the upstream one, not this file.
on:
  push:
    branches-ignore: [main]
    tags: ['v*']
  pull_request:

# A newer push to the same branch supersedes an in-flight run. macOS minutes
# count 10x against the private-repo allowance, so do not stack them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Domain tests + build smoke check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Fast, and needs no secrets or signing: scripts/test.sh compiles
      # State.swift + Log.swift + Analytics.swift + Tests/main.swift with swiftc.
      # Runs first so a logic failure does not burn build minutes.
      - name: Domain tests
        run: sh scripts/test.sh

      - name: Desktop pet motion checks (macOS presentation)
        run: sh scripts/test-pet-motion.sh

      # The project signs Automatically with the user's Personal Team, which the
      # runner has no account for. CI therefore builds unsigned and ad-hoc re-signs the
      # host app as a compile gate only; this artifact is not the locally signed release.
      - name: Build Release (unsigned, then ad-hoc re-signed)
        run: |
          xcodebuild -project TomatoBar.xcodeproj -scheme TomatoBar -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO build

      - name: Verify product
        run: |
          app="build/Build/Products/Release/TomatoBar Personal.app"
          test -d "$app"
          codesign -s - --force --options runtime \
            --entitlements TomatoBar/TomatoBar.entitlements "$app"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" \
            | grep -x 'com.dilyar.TomatoBarPersonal'

      # The Release build above already produced the SwiftPM module artifacts the
      # bridge needs; TOMATOBAR_BUILD_DIR repoints the script at the runner's path.
      # This is the only suite that compiles App/Timer/View/MainWindow and runs
      # real TBTimer IO — until now it existed only as a local ritual.
      - name: Bridge checks (real TBTimer + UI compile, isolated QA13 IO)
        run: TOMATOBAR_BUILD_DIR=build sh scripts/test-bridge.sh

      - name: Launch-context checks (synthetic events)
        run: sh scripts/test-launch-context.sh
