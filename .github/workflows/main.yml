name: tests

# Replaces the upstream release workflow, which was unusable here: it needs
# CODESIGN_CERT_* secrets this repo does not have, its Build step hardcodes
# TomatoBar.app while PRODUCT_NAME is "TomatoBar Personal", and its first step
# deletes a prerelease tag. See docs/BACKLOG.md P7.
#
# `main` is excluded because it is the frozen upstream baseline (90a77d6) and
# contains neither scripts/test.sh nor Tests/. Note that a push to `main` would
# run the workflow file from that ref, i.e. the upstream one, not this file.
on:
  push:
    branches-ignore: [main]
    tags: ['v*']
  pull_request:

# A newer push to the same branch supersedes an in-flight run. macOS minutes
# count 10x against the private-repo allowance, so do not stack them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Domain tests + build smoke check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Fast, and needs no secrets or signing: scripts/test.sh compiles
      # State.swift + Log.swift + Analytics.swift + Tests/main.swift with swiftc.
      # Runs first so a logic failure does not burn build minutes.
      - name: Domain tests
        run: sh scripts/test.sh

      # scripts/test.sh only compiles 3 of the 9 Swift files. The UI and bridging
      # layer (App, Timer, View, MainWindow, FocusCharts, Notifications) is covered
      # by nothing else, so a compile check is the only guard against a typo there.
      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild -project TomatoBar.xcodeproj -scheme TomatoBar -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO build

      - name: Verify product
        run: |
          app="build/Build/Products/Release/TomatoBar Personal.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" \
            | grep -x 'com.dilyar.TomatoBarPersonal'
